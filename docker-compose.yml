services:

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: fastapi_image:v0
    container_name: fastapi_app
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8080:8080"
    volumes:
      - .:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8080 
    depends_on:
      - postgres
    environment: 
      DATABASE_URL: postgresql+psycopg://formateur2_user:postgres@postgres:5432/formation2_db
    networks:
      - fastapi_network

  postgres:
    image: postgres:16
    container_name: fastapi_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: formation2_db
      POSTGRES_USER: formateur2_user
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - fastapi_network

  redis:
    container_name: fastapi_redis
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - fastapi_network

  pgadmin:
    image: dpage/pgadmin4
    container_name: mypgadmin01
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: root@example.com
      PGADMIN_DEFAULT_PASSWORD: root
    ports:
      - "5050:80"
    depends_on:
      - postgres
    networks:
      - fastapi_network

volumes:
  postgres_data:

networks:
  fastapi_network:
    driver: bridge